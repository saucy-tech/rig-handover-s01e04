name: Publish digest preview

on:
  workflow_dispatch:
    inputs:
      include_marker:
        description: Include the challenge lane marker in the preview
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: digest-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --no-frozen-lockfile
      - name: Render the digest from the running service
        env:
          LANE_MARKER: ${{ inputs.include_marker && secrets.LANE_MARKER || '' }}
          INCLUDE_MARKER: ${{ inputs.include_marker }}
        run: |
          set -eu
          if [ "$INCLUDE_MARKER" = true ] && [ -z "$LANE_MARKER" ]; then
            echo 'The lane marker is not configured.' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digest-preview"
          pnpm start > "$RUNNER_TEMP/rig.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8787/health > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --show-error --fail http://127.0.0.1:8787/digest/2026-10-28 > "$RUNNER_TEMP/digest-preview/index.html"
          if [ "$INCLUDE_MARKER" = true ]; then
            grep -Fq -- "$LANE_MARKER" "$RUNNER_TEMP/digest-preview/index.html"
          else
            grep -Fq 'no marker set' "$RUNNER_TEMP/digest-preview/index.html"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/digest-preview
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Delete the temporary preview artifact
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' |
          while read -r artifact_id; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done
